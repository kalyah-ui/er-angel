#cloud-config
# First boot of the ER Angel server. NO SECRETS in this file: user data is
# stored in Vultr's instance metadata. Secrets go in /opt/er-angel/.env,
# copied over SSH later.

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - git
  - unattended-upgrades

# Key-only SSH (the key Terraform uploaded); root may log in with a key only.
ssh_pwauth: false
disable_root: false

write_files:
  # sshd reads sshd_config.d/*.conf in order and the first value wins, so this
  # beats cloud-init's own 50-cloud-init.conf.
  - path: /etc/ssh/sshd_config.d/00-er-angel.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password

runcmd:
  # No usable root password either (belt and braces for the console).
  - passwd -l root
  - systemctl restart ssh
  - systemctl enable --now docker
  - mkdir -p /opt/er-angel
  - chmod 700 /opt/er-angel
  - mkdir -p /var/lib/er-angel && date -u > /var/lib/er-angel/cloud-init-done
