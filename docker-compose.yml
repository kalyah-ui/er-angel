# Production stack for the Vultr server: backend + Caddy (HTTPS, dashboard,
# /api proxy). The kiosk and presage-agent run on a laptop, not here.
#
#   cp .env.example .env      # on the server, fill in real values (never committed)
#   docker compose up -d --build
#
# Local development doesn't use this file -- keep using `npm run dev`.
name: er-angel

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - backend-data:/app/data # SQLite db + ElevenLabs voice cache
    # Not published: only reachable by Caddy on the internal network.
    expose:
      - "4000"

  web:
    build:
      context: ./frontend-dashboard
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    # Only what Caddy needs (not the API keys). ":?" = refuse to start if unset/empty.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      DASHBOARD_USER: ${DASHBOARD_USER:?set DASHBOARD_USER in .env}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?set DASHBOARD_PASSWORD_HASH in .env}
      KIOSK_TOKEN: ${KIOSK_TOKEN:?set KIOSK_TOKEN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # HTTPS certificates -- keep, or Caddy re-requests them
      - caddy-config:/config

volumes:
  backend-data:
  caddy-data:
  caddy-config:
