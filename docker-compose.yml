# Production stack for the Vultr server: backend + Caddy (HTTPS, dashboard,
# /api proxy). The kiosk and presage-agent run on a laptop, not here.
#
#   cp .env.example .env      # on the server, fill in real values (never committed)
#   docker compose up -d --build
#
# Local development doesn't use this file -- keep using `npm run dev`.
name: er-angel

# Docker's default json-file driver never rotates: cap each container's logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    env_file: .env
    volumes:
      - backend-data:/app/data # SQLite db + ElevenLabs voice cache
    # Not published: only reachable by Caddy on the internal network.
    expose:
      - "4000"

  web:
    # Caddy + the built dashboard and kiosk (see deploy/web.Dockerfile).
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    # Only what Caddy needs (not the API keys). ":?" = refuse to start if unset/empty.
    # Hostnames come from .env (deploy/set-hosts.sh), so a custom domain is a
    # config change, not a code change.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      DASHBOARD_ADDRESS: ${DASHBOARD_ADDRESS:?set DASHBOARD_ADDRESS in .env (bash deploy/set-hosts.sh)}
      KIOSK_ADDRESS: ${KIOSK_ADDRESS:?set KIOSK_ADDRESS in .env (bash deploy/set-hosts.sh)}
      DASHBOARD_USER: ${DASHBOARD_USER:?set DASHBOARD_USER in .env}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?set DASHBOARD_PASSWORD_HASH in .env}
      KIOSK_TOKEN: ${KIOSK_TOKEN:?set KIOSK_TOKEN in .env}
    volumes:
      # The folder, not the single file: git pull replaces files, and a
      # single-file bind mount would keep serving the old Caddyfile.
      - ./deploy:/etc/caddy:ro
      - caddy-data:/data # HTTPS certificates (keep, or Caddy re-requests them) + logs/access.log
      - caddy-config:/config

volumes:
  backend-data:
  caddy-data:
  caddy-config:
