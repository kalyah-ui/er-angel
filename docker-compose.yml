version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data

  kiosk:
    build: ./frontend-kiosk
    ports:
      - "5173:5173"
    depends_on:
      - backend

  dashboard:
    build: ./frontend-dashboard
    ports:
      - "5174:5174"
    depends_on:
      - backend
